<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hrad - Prototyp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Hlavná mapa -->
    <canvas id="detailCanvas"></canvas>

    <!-- Minimap -->
    <div id="minimap-container">
      <canvas id="overviewCanvas"></canvas>
    </div>
  </div>

  <!-- Spodný panel -->
  <div id="bottom-bar">
    <button id="btnA" class="mode-btn active" title="Štvorec">a</button>
    <button id="btnB" class="mode-btn" title="Polovica obrazovky">b</button>
    <button id="btnC" class="mode-btn" title="Minimalizovať">c</button>
  </div>

  <div id="info">Ťahaj mapu • a / b / c menia minimapu</div>

  <script src="js/main.js"></script>
</body>
</html>
