<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hrad - Prototyp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- Hlavná mapa -->
    <canvas id="detailCanvas"></canvas>

    <!-- Minimap -->
    <div id="minimap-container">
      <canvas id="overviewCanvas"></canvas>
    </div>
  </div>

  <!-- Spodná lišta -->
  <div id="bottom-bar">
    <span class="slider-label">Minimap</span>
    <input type="range" id="minimapSlider" min="0" max="100" value="72">
  </div>

  <!-- Info riadok -->
  <div id="info">Načítavam mapu...</div>

  <script src="js/main.js"></script>
</body>
</html>
