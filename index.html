<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mapa 3D + minimapa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b0b; font-family: Arial, sans-serif; }
    #canvas3d { display: block; width: 100%; height: 100%; }

    #info {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: #ccc; padding: 6px 12px;
      border-radius: 4px; font-size: 13px; z-index: 20; pointer-events: none;
    }
    #coords {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: #a7f3d0; padding: 6px 12px;
      border-radius: 4px; font-size: 13px; z-index: 20; pointer-events: none;
      display: none;
    }

    #minimap-container {
      position: fixed; right: 12px; bottom: 56px; z-index: 15;
      border: 1px solid #333; background: #111; border-radius: 4px; overflow: hidden;
    }
    #minimap-container.hidden { display: none; }
    #overviewCanvas { display: block; cursor: crosshair; }

    #bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 48px;
      background: #1a1a1a; border-top: 1px solid #333;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 10px; padding: 0 16px; z-index: 20; color: #aaa; font-size: 13px;
    }
    #minimapSlider { width: 140px; }
  </style>
</head>
<body>
  <div id="info">Nacitam mapy...</div>
  <div id="coords"></div>
  <canvas id="canvas3d"></canvas>

  <div id="minimap-container">
    <canvas id="overviewCanvas"></canvas>
  </div>

  <div id="bottom-bar">
    <span>Minimap</span>
    <input type="range" id="minimapSlider" min="0" max="100" value="72">
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
